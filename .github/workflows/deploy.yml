name: Deploy na GitHub Pages

# Aplikacija je statička (bez bundlera): objavljuje se sadržaj korena repozitorijuma,
# a JavaScript i CSS se pri objavi samo smanje (minify) — izvorni kod u repozitorijumu ostaje čitljiv.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Pripremi fajlove za objavu
        run: |
          mkdir -p _site
          cp -r index.html privacy.html manifest.webmanifest sw.js .nojekyll src icons screenshots assets vendor fonts _site/
      - name: Broj verzije u adresama fajlova (bez mešanja starih i novih fajlova)
        run: node scripts/version-urls.mjs _site
      - name: Smanji JavaScript i CSS (samo objavljena kopija; izvorni kod ostaje čitljiv)
        run: |
          npx --yes esbuild@0.24.2 _site/src/*.js --minify --target=es2022 --format=esm --outdir=_site/src --allow-overwrite --log-level=warning
          npx --yes esbuild@0.24.2 _site/src/styles.css --minify --outfile=_site/src/styles.css --allow-overwrite --log-level=warning
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
