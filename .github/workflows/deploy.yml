name: Deploy na GitHub Pages

# Aplikacija je statička (nema build koraka), isto kao Trening-za-decu:
# objavljuje se sadržaj korena repozitorijuma.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Pripremi fajlove za objavu
        run: |
          mkdir -p _site
          cp -r index.html privacy.html manifest.webmanifest sw.js .nojekyll src icons screenshots assets vendor fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
