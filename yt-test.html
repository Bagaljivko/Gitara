<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gitara · test malog YouTube plejera</title>
<style>
  /* Privremena test stranica (nije deo aplikacije): da li YouTube pušta video u malom plejeru (traka „Uz video“). */
  :root { --bg: #000; --surface: #0f1013; --surface-2: #16181c; --line: #2a2d34; --text: #eceef2; --muted: #9ea2aa; --gold: #f59e0b; --gold2: #ffcc33; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; padding: 0 16px 40px; }
  .strip { position: sticky; top: 0; z-index: 5; background: #000; border-bottom: 1px solid rgba(245, 158, 11, .28); display: flex; align-items: center; gap: 10px; padding: 6px 0; margin: 0 -16px; padding-left: 10px; padding-right: 10px; }
  .vid { position: relative; flex: none; border-radius: 8px; overflow: hidden; background: #111; }
  .vid iframe, .vid > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .touch { position: absolute; inset: 0; z-index: 2; touch-action: none; }
  .scrubtip { position: absolute; left: 0; right: 0; bottom: 2px; z-index: 3; text-align: center; font: 700 11px system-ui; color: #ffcc33; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .ctl { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .b { appearance: none; border: 0; background: none; color: #a9adb5; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; }
  .b svg { width: 28px; height: 28px; fill: currentColor; }
  .b text { fill: currentColor; }
  .play { width: 48px; height: 48px; border-radius: 50%; background: #121316; border: 1.5px solid rgba(245, 158, 11, .7); color: #ffcc33; }
  .play svg { width: 24px; height: 24px; }
  h1 { font-size: 1.35rem; margin: 18px 0 4px; background: linear-gradient(100deg, #f59e0b, #ffcc33 65%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.m { color: var(--muted); margin: 0 0 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
  .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sz { appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 12px; padding: 10px 8px; font: 700 .9rem system-ui; text-align: left; cursor: pointer; }
  .sz small { display: block; color: var(--muted); font-weight: 600; }
  .sz.on { border-color: var(--gold); background: rgba(245, 158, 11, .1); }
  .sz .res { float: right; }
  label.f { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 15px system-ui; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 12px; min-height: 44px; padding: 0 14px; font: 700 .95rem system-ui; cursor: pointer; }
  .btn.p { border: 0; color: #1a1203; background: linear-gradient(135deg, #ffcc33, #f59e0b 55%, #b45309); }
  .st { font: 600 .9rem ui-monospace, monospace; white-space: pre-wrap; color: #c9ccd2; }
  .ok { color: #3dd68c; } .bad { color: #ff6b6b; }
  textarea { width: 100%; min-height: 120px; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font: 13px ui-monospace, monospace; }
</style>
</head>
<body>
<div class="strip" id="strip">
  <div class="vid" id="vid"><div id="player"></div><div class="touch" id="touch"></div><div class="scrubtip" id="tip"></div></div>
  <div class="ctl">
    <button class="b" id="back" aria-label="10 sekundi nazad"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="800" text-anchor="middle" font-family="system-ui">10</text></svg></button>
    <button class="b play" id="pp" aria-label="Pusti"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="b" id="fwd" aria-label="10 sekundi napred"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="800" text-anchor="middle" font-family="system-ui">10</text></svg></button>
  </div>
</div>

<h1>Test: mali YouTube plejer</h1>
<p class="m">Za svaku veličinu: dodirni zlatno dugme za pauzu/pusti, proveri da li se čuje zvuk, probaj −10/+10 i prevuci prstom levo-desno preko videa. Ispod se vidi šta YouTube javlja.</p>

<div class="card">
  <label class="f">Veličina trake</label>
  <div class="sizes" id="sizes"></div>
</div>

<div class="card">
  <label class="f" for="url">YouTube link ili ID (probaj i neku pesmu koju stvarno sviraš)</label>
  <input id="url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ" autocomplete="off" inputmode="url">
  <div class="row"><button class="btn p" id="load">Učitaj</button></div>
</div>

<div class="card"><div class="st" id="st">Učitavam YouTube…</div></div>

<div class="card">
  <label class="f">Rezultat (kopiraj i pošalji)</label>
  <textarea id="report" readonly></textarea>
  <div class="row"><button class="btn" id="copy">Kopiraj</button></div>
</div>

<script>
  // Veličine: visina trake → video 16:9 (traka 96 px ≈ video 150×84, kao u predlogu)
  const SIZES = [
    { id: 's96', label: 'Upola (izabrano)', strip: 96, w: 150, h: 84 },
    { id: 's80', label: 'Tanje', strip: 80, w: 121, h: 68 },
    { id: 's64', label: 'Najtanje', strip: 64, w: 92, h: 52 },
    { id: 's200', label: 'YouTube minimum', strip: 212, w: 356, h: 200 },
  ];
  const STATE = { '-1': 'nije počeo', 0: 'kraj', 1: 'SVIRA', 2: 'pauza', 3: 'učitava', 5: 'spreman' };
  const ERR = { 2: 'loš ID', 5: 'HTML5 greška', 100: 'video ne postoji / privatan', 101: 'vlasnik ne dozvoljava ugradnju', 150: 'vlasnik ne dozvoljava ugradnju' };
  const $ = (id) => document.getElementById(id);
  const results = {};
  let player = null, size = SIZES[0], vidId = 'dQw4w9WgXcQ', log = [], everPlayed = false, lastErr = '';
  const ua = navigator.userAgent;
  const idOf = (s) => { s = s.trim(); const m = /(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/.exec(s); return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : null); };
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

  function drawSizes() {
    $('sizes').innerHTML = SIZES.map((s) => {
      const r = results[s.id + ':' + vidId];
      return `<button class="sz${s === size ? ' on' : ''}" data-id="${s.id}">${s.label}<span class="res">${r === true ? '<b class="ok">✓</b>' : r === false ? '<b class="bad">✗</b>' : ''}</span><small>traka ${s.strip} px · video ${s.w}×${s.h}</small></button>`;
    }).join('');
  }
  function applySize() {
    $('vid').style.width = size.w + 'px'; $('vid').style.height = size.h + 'px';
    $('strip').style.height = size.strip + 'px';
    drawSizes();
  }
  function status(extra = '') {
    let s = 'veličina: ' + size.w + '×' + size.h + '\n';
    if (player && player.getPlayerState) {
      const st = player.getPlayerState();
      s += 'stanje: ' + (STATE[st] || st) + '\nvreme: ' + fmt(player.getCurrentTime() || 0) + ' / ' + fmt(player.getDuration() || 0) + '\n';
      try { s += 'kvalitet: ' + (player.getPlaybackQuality() || '?') + '\n'; } catch {}
    }
    if (lastErr) s += 'GREŠKA: ' + lastErr + '\n';
    $('st').innerHTML = s.replace('SVIRA', '<b class="ok">SVIRA</b>').replace(/GREŠKA: .*/, (x) => `<b class="bad">${x}</b>`) + extra;
  }
  function report() {
    const lines = Object.entries(results).map(([k, v]) => { const [sid, vid] = k.split(':'); const s = SIZES.find((x) => x.id === sid); return `${s.w}×${s.h} (${vid}): ${v ? 'svira ✓' : 'NE svira ✗'}`; });
    $('report').value = ['Gitara test malog plejera', 'Uređaj: ' + ua, ...lines, ...log.slice(-12)].join('\n');
  }
  function note(t) { log.push(new Date().toLocaleTimeString() + ' ' + t); report(); }

  function makePlayer() {
    everPlayed = false; lastErr = '';
    if (player) { try { player.destroy(); } catch {} player = null; }
    $('vid').querySelector('#player')?.remove();
    const d = document.createElement('div'); d.id = 'player'; $('vid').prepend(d);
    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: vidId,
      playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, fs: 0, iv_load_policy: 3, origin: location.origin },
      events: {
        onReady: () => { note(`spreman (${size.w}×${size.h}, ${vidId})`); status(); },
        onStateChange: (e) => {
          if (e.data === 1) { everPlayed = true; results[size.id + ':' + vidId] = true; drawSizes(); }
          setIcon(e.data === 1); note('stanje: ' + (STATE[e.data] ?? e.data)); status();
        },
        onError: (e) => { lastErr = ERR[e.data] || ('kod ' + e.data); results[size.id + ':' + vidId] = false; drawSizes(); note('greška: ' + lastErr); status(); },
      },
    });
  }
  function setIcon(playing) { $('ppi').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }

  // Ako posle dodira na „pusti“ za 8 s ne krene — zabeleži da ne svira u toj veličini
  let watch = 0;
  $('pp').addEventListener('click', () => {
    if (!player || !player.getPlayerState) return;
    if (player.getPlayerState() === 1) { player.pauseVideo(); return; }
    player.playVideo();
    clearTimeout(watch);
    const key = size.id + ':' + vidId;
    watch = setTimeout(() => { if (player.getPlayerState() !== 1 && results[key] !== true) { results[key] = false; drawSizes(); note('nije krenuo za 8 s'); } }, 8000);
  });
  $('back').addEventListener('click', () => { if (player?.seekTo) { player.seekTo(Math.max(0, player.getCurrentTime() - 10), true); note('−10 s'); } });
  $('fwd').addEventListener('click', () => { if (player?.seekTo) { player.seekTo(player.getCurrentTime() + 10, true); note('+10 s'); } });

  // Prevlačenje preko videa: levo/desno = premotavanje (cela širina videa ≈ 60 s), uživo dok prst ide
  let drag = null;
  const touch = $('touch');
  touch.addEventListener('pointerdown', (e) => { if (!player?.getCurrentTime) return; touch.setPointerCapture(e.pointerId); drag = { x: e.clientX, t: player.getCurrentTime(), moved: false, last: 0 }; });
  touch.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x; if (Math.abs(dx) > 6) drag.moved = true; if (!drag.moved) return;
    const target = Math.max(0, Math.min(player.getDuration() || 1e9, drag.t + (dx / size.w) * 60));
    $('tip').textContent = fmt(target);
    const now = performance.now(); if (now - drag.last > 120) { drag.last = now; player.seekTo(target, true); }
    drag.target = target;
  });
  const end = () => { if (!drag) return; if (drag.moved && drag.target != null) { player.seekTo(drag.target, true); note('prevučeno na ' + fmt(drag.target)); } $('tip').textContent = ''; drag = null; };
  touch.addEventListener('pointerup', end); touch.addEventListener('pointercancel', end);

  $('sizes').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (!b) return; size = SIZES.find((s) => s.id === b.dataset.id); applySize(); makePlayer(); });
  $('load').addEventListener('click', () => { const id = idOf($('url').value); if (!id) { lastErr = 'ne prepoznajem link'; status(); return; } vidId = id; makePlayer(); drawSizes(); });
  $('copy').addEventListener('click', async () => { report(); try { await navigator.clipboard.writeText($('report').value); $('copy').textContent = 'Kopirano ✓'; } catch { $('report').select(); } });

  setInterval(() => { if (player && player.getPlayerState) status(); }, 500);
  window.onYouTubeIframeAPIReady = () => { applySize(); makePlayer(); };
  applySize(); report();
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { lastErr = 'YouTube se ne učitava (mreža?)'; status(); };
  document.head.appendChild(s);
</script>
</body>
</html>
