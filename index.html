    .boot img { width: 72px; height: 72px; border-radius: 18px; }

    /* MARLI (Melodija, Akordi, Ritam, Ljubav, Inspiracija) — uvodni ekran (animacija 4: glava gitare iz tunera, ključevi se uštimuju, ime izraste). Samo CSS + SVG. */
    #marliIntro { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; cursor: pointer; transition: opacity .35s ease; -webkit-tap-highlight-color: transparent; }
    #marliIntro.out { opacity: 0; pointer-events: none; }
    #marliIntro svg { width: min(80vw, 360px); height: auto; overflow: visible; }
    #marliIntro .mi-img { opacity: 0; animation: mi-fade .4s ease-out forwards; }
    #marliIntro .mi-kn { fill: rgba(255, 255, 255, 0); stroke: rgba(255, 255, 255, .5); stroke-width: 3; stroke-linejoin: round; animation: mi-kn .38s ease-out forwards; }
    #marliIntro .mi-nm { opacity: 0; transform: translateY(18px); animation: mi-rise .55s cubic-bezier(.2, .9, .25, 1.1) 1.15s forwards; }
    #marliIntro .mi-w { display: flex; flex-wrap: nowrap; white-space: nowrap; justify-content: center; gap: 0 .32em; color: #9aa1ad; font: 400 15px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    #marliIntro .mi-w span { opacity: 0; transform: translateY(6px); display: inline-block; animation: mi-word .32s cubic-bezier(.2, .8, .2, 1) forwards; }

    @keyframes mi-kn { 0% { fill: rgba(255, 255, 255, 0); } 40% { fill: rgba(245, 150, 30, .6); stroke: #f5a524; stroke-width: 5; } 100% { fill: rgba(40, 190, 105, .82); stroke: #6ff0aa; stroke-width: 4; } }
